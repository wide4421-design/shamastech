<title>Store Incharge Portfolio</title>

<style>
:root{
  --font-body:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --font-head:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --primary:#0b1f3a; --primary-2:#132c4f; --accent:#c9a227;
  --bg:#f5f7fb; --surface:#ffffff; --surface-2:#eef2f9;
  --text:#0f1b2d; --muted:#5c6b83; --border:#e0e6f0;
  --radius:14px; --shadow:0 10px 30px rgba(11,31,58,.08);
  --shadow-lg:0 24px 60px rgba(11,31,58,.16);
  --ok:#12855a; --err:#c62828; --warn:#b26a00;
}
[data-theme="dark"]{
  --bg:#0a1220; --surface:#111d31; --surface-2:#16243a;
  --text:#e8eef8; --muted:#96a6bf; --border:#22334d;
  --shadow:0 10px 30px rgba(0,0,0,.45); --shadow-lg:0 24px 60px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--text);line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{font-family:var(--font-head);line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2rem,4.5vw,3.4rem);font-weight:800}
h2{font-size:clamp(1.5rem,3vw,2.2rem);font-weight:750}
h3{font-size:1.15rem;font-weight:700}
p{margin:0 0 1em}
.container{max-width:1180px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)} .small{font-size:.86rem} .center{text-align:center} .hidden{display:none!important}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;padding:11px 20px;border-radius:var(--radius);border:1px solid transparent;font:inherit;font-weight:600;font-size:.94rem;cursor:pointer;transition:.18s ease;background:var(--surface-2);color:var(--text);white-space:nowrap}
.btn:hover{transform:translateY(-1px)} .btn:active{transform:translateY(0)}
.btn-primary{background:var(--primary);color:#fff} .btn-primary:hover{background:var(--primary-2)}
.btn-accent{background:var(--accent);color:#101010} .btn-accent:hover{filter:brightness(1.07)}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text)} .btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:var(--err);color:#fff}
.btn-sm{padding:7px 13px;font-size:.83rem;border-radius:10px}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.icon-btn{background:transparent;border:0;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:8px}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.site-nav{position:sticky;top:0;z-index:60;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:0 1px 0 rgba(0,0,0,.02)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;height:70px}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:1.05rem;letter-spacing:-.02em}
.brand-mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;display:grid;place-items:center;font-size:.95rem;font-weight:800;letter-spacing:.02em;border:1px solid rgba(201,162,39,.5)}
.nav-links{display:flex;align-items:center;gap:4px;list-style:none;margin:0;padding:0}
.nav-links a{padding:9px 13px;border-radius:9px;font-size:.92rem;font-weight:600;color:var(--muted);transition:.15s}
.nav-links a:hover{color:var(--text);background:var(--surface-2)}
.nav-actions{display:flex;align-items:center;gap:8px}
.hamburger{display:none;background:transparent;border:1px solid var(--border);border-radius:10px;padding:8px 11px;cursor:pointer;color:var(--text);font-size:1.1rem}
@media(max-width:920px){
  .nav-links{display:none;position:absolute;top:70px;left:0;right:0;background:var(--surface);border-bottom:1px solid var(--border);flex-direction:column;align-items:stretch;padding:10px;gap:2px;box-shadow:var(--shadow)}
  .nav-links.open{display:flex} .hamburger{display:block}
}
.user-chip{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);font-size:.82rem;font-weight:700;cursor:pointer;position:relative;user-select:none}
.user-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;display:grid;place-items:center;font-size:.78rem;font-weight:800;overflow:hidden}
.user-avatar img{width:100%;height:100%;object-fit:cover}
.user-menu{position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);min-width:210px;padding:6px;z-index:120;display:none}
.user-menu.open{display:block}
.user-menu button,.user-menu a{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:8px;border:0;background:transparent;font:inherit;font-size:.86rem;font-weight:600;cursor:pointer;color:var(--text)}
.user-menu button:hover,.user-menu a:hover{background:var(--surface-2)}
.like-btn{display:inline-flex;align-items:center;gap:5px;background:transparent;border:1px solid var(--border);border-radius:99px;padding:4px 11px;font:inherit;font-size:.78rem;font-weight:700;cursor:pointer;color:var(--muted);transition:.15s}
.like-btn:hover{border-color:#e0245e;color:#e0245e}
.like-btn.liked{background:rgba(224,36,94,.1);border-color:#e0245e;color:#e0245e}
.share-btn{display:inline-flex;align-items:center;gap:5px;background:transparent;border:1px solid var(--border);border-radius:99px;padding:4px 11px;font:inherit;font-size:.78rem;font-weight:700;cursor:pointer;color:var(--muted);transition:.15s}
.share-btn:hover{border-color:var(--accent);color:var(--accent)}
#followBtn.is-following{background:rgba(201,162,39,.16);border-color:var(--accent);color:var(--accent)}
.hero-actions #followBtn{color:#fff;border-color:rgba(255,255,255,.28)}
.hero-actions #followBtn:hover{background:rgba(255,255,255,.1)}
.hero-actions #followBtn.is-following{background:rgba(201,162,39,.22);border-color:var(--accent);color:var(--accent)}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border-radius:11px;border:1px solid var(--border);background:var(--surface);font:inherit;font-weight:700;font-size:.92rem;cursor:pointer;color:var(--text)}
.google-btn:hover{background:var(--surface-2)}
.google-btn:disabled{opacity:.6;cursor:not-allowed}
.divider-or{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--muted);font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.divider-or::before,.divider-or::after{content:"";flex:1;height:1px;background:var(--border)}
#googleSignInContainer{display:flex;justify-content:center;margin-bottom:4px}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--primary) 0%,var(--primary-2) 55%,#081627 100%);color:#fff;padding:72px 0 88px}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(700px 380px at 82% 12%,rgba(201,162,39,.20),transparent 60%),radial-gradient(600px 340px at 8% 88%,rgba(80,140,255,.16),transparent 62%);pointer-events:none}
.hero-grid{position:relative;display:grid;grid-template-columns:1.25fr .75fr;gap:56px;align-items:center}
.hero-eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.hero-eyebrow::before{content:"";width:26px;height:2px;background:var(--accent);display:block}
.hero h1{color:#fff}
.hero .role{font-size:1.12rem;color:rgba(255,255,255,.82);font-weight:600;margin-bottom:16px}
.hero p.lead{color:rgba(255,255,255,.78);max-width:56ch;font-size:1.02rem}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin:26px 0 24px}
.hero-actions .btn-ghost{color:#fff;border-color:rgba(255,255,255,.28)}
.hero-actions .btn-ghost:hover{background:rgba(255,255,255,.1)}
.hero-social{display:flex;gap:10px;flex-wrap:wrap}
.hero-social a{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);color:#fff;font-size:.85rem;font-weight:700;transition:.18s}
.hero-social a:hover{background:var(--accent);color:#101010;transform:translateY(-2px)}
.hero-photo-wrap{position:relative;display:flex;justify-content:center}
.hero-photo{width:min(320px,80vw);aspect-ratio:1;border-radius:26px;object-fit:cover;border:1px solid rgba(255,255,255,.2);box-shadow:0 30px 70px rgba(0,0,0,.42)}
.hero-photo-ring{position:absolute;inset:-16px;border:1.5px dashed rgba(201,162,39,.45);border-radius:34px;pointer-events:none}
.stat-strip{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:56px;padding-top:30px;border-top:1px solid rgba(255,255,255,.14)}
.stat{text-align:center}
.stat b{display:block;font-size:clamp(1.6rem,3vw,2.2rem);font-weight:800;color:var(--accent);line-height:1}
.stat span{font-size:.82rem;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.66);font-weight:600}
@media(max-width:860px){
  .hero-grid{grid-template-columns:1fr;gap:36px;text-align:center}
  .hero-eyebrow{justify-content:center} .hero-eyebrow::before{display:none}
  .hero p.lead{margin-inline:auto}
  .hero-actions,.hero-social{justify-content:center}
  .hero-photo-wrap{order:-1}
}
.section{padding:78px 0}
.section-alt{background:var(--surface-2)}
.section-head{max-width:720px;margin:0 auto 44px;text-align:center}
.section-head .kicker{font-size:.78rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.section-head p{color:var(--muted);margin:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.grid{display:grid;gap:20px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
.about-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:44px;align-items:start}
@media(max-width:900px){.about-grid{grid-template-columns:1fr}}
.about-card{padding:26px}
.pill-list{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.pill{padding:7px 14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-size:.83rem;font-weight:600}
.pill.gold{background:rgba(201,162,39,.13);border-color:rgba(201,162,39,.42);color:var(--accent)}
.info-row{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px dashed var(--border);font-size:.92rem}
.info-row:last-child{border-bottom:0}
.info-row span:first-child{color:var(--muted);font-weight:600}
.info-row span:last-child{text-align:right;font-weight:600}
.skill-card{padding:20px;transition:.2s}
.skill-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.skill-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.skill-top b{font-size:.98rem}
.skill-top i{font-style:normal;font-size:.82rem;color:var(--accent);font-weight:800}
.skill-desc{font-size:.85rem;color:var(--muted);margin:0 0 12px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--accent));width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.timeline{position:relative;padding-left:34px}
.timeline::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--accent),var(--border))}
.tl-item{position:relative;margin-bottom:26px}
.tl-item::before{content:"";position:absolute;left:-30px;top:22px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);box-shadow:0 0 0 4px var(--bg)}
.tl-card{padding:22px 24px}
.tl-head{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.tl-head b{font-size:1.05rem}
.tl-role{color:var(--accent);font-weight:700;font-size:.9rem}
.tl-dur{font-size:.8rem;font-weight:700;background:var(--surface-2);padding:5px 12px;border-radius:99px;color:var(--muted);white-space:nowrap}
.tl-card ul{margin:10px 0 0;padding-left:20px;font-size:.9rem;color:var(--muted)}
.tl-card ul li{margin-bottom:5px}
.filter-row{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-bottom:30px}
.chip{padding:8px 16px;border-radius:99px;border:1px solid var(--border);background:var(--surface);font-size:.85rem;font-weight:700;cursor:pointer;transition:.15s;color:var(--muted)}
.chip:hover{color:var(--text);border-color:var(--accent)}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.proj-card{overflow:hidden;cursor:pointer;transition:.22s;display:flex;flex-direction:column}
.proj-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg)}
.proj-img{aspect-ratio:16/10;background:var(--surface-2);overflow:hidden}
.proj-img img{width:100%;height:100%;object-fit:cover;transition:transform .45s}
.proj-card:hover .proj-img img{transform:scale(1.06)}
.proj-body{padding:18px 20px 20px;flex:1;display:flex;flex-direction:column}
.proj-cat{font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:7px}
.proj-body h3{margin-bottom:7px}
.proj-body p{font-size:.88rem;color:var(--muted);margin:0}
.proj-meta{margin-top:auto;padding-top:14px;font-size:.78rem;color:var(--muted);font-weight:600}
.post-card{overflow:hidden;cursor:pointer;transition:.22s;display:flex;flex-direction:column}
.post-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg)}
.post-img{aspect-ratio:16/9;background:var(--surface-2);overflow:hidden}
.post-img img{width:100%;height:100%;object-fit:cover;transition:transform .45s}
.post-card:hover .post-img img{transform:scale(1.05)}
.post-body{padding:20px;flex:1;display:flex;flex-direction:column}
.post-tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:rgba(201,162,39,.12);padding:3px 9px;border-radius:99px}
.post-body h3{font-size:1.08rem;margin-bottom:8px}
.post-body p{font-size:.88rem;color:var(--muted);margin:0}
.post-foot{margin-top:auto;padding-top:16px;display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--muted);font-weight:600}
.post-foot .pf-right{display:flex;align-items:center;gap:8px}
.contact-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:34px;align-items:start}
@media(max-width:900px){.contact-grid{grid-template-columns:1fr}}
.contact-item{display:flex;gap:14px;align-items:flex-start;padding:15px 0;border-bottom:1px dashed var(--border)}
.contact-item:last-child{border:0}
.ci-icon{width:42px;height:42px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:1.05rem;flex:0 0 auto;border:1px solid var(--border)}
.contact-item b{display:block;font-size:.82rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:2px}
.contact-item a,.contact-item span{font-weight:600;font-size:.95rem;word-break:break-word}
.field{display:block;margin-bottom:16px}
.field>span{display:block;font-size:.83rem;font-weight:700;margin-bottom:6px;color:var(--text);letter-spacing:.02em}
.field>span .req{color:var(--err)}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=url],input[type=number],input[type=date],select,textarea{
  width:100%;padding:11px 14px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:.94rem;transition:.15s;outline:none
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,162,39,.16)}
textarea{resize:vertical;min-height:90px}
label.check{display:flex;align-items:center;gap:9px;font-size:.9rem;font-weight:600;cursor:pointer;margin-bottom:14px}
label.check input{width:17px;height:17px;accent-color:var(--accent)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:620px){.form-row{grid-template-columns:1fr}}
.hp{position:absolute!important;left:-9999px!important;opacity:0!important;height:0!important;width:0!important}
.site-footer{background:var(--primary);color:rgba(255,255,255,.8);padding:52px 0 26px;margin-top:0}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:36px;margin-bottom:34px}
@media(max-width:820px){.footer-grid{grid-template-columns:1fr;gap:26px}}
.site-footer h4{color:#fff;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:16px}
.site-footer a{color:rgba(255,255,255,.72);font-size:.92rem;display:block;padding:4px 0;transition:.15s}
.site-footer a:hover{color:var(--accent)}
.footer-bottom{border-top:1px solid rgba(255,255,255,.14);padding-top:20px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:.84rem;color:rgba(255,255,255,.55)}
.modal-backdrop{position:fixed;inset:0;background:rgba(6,14,26,.62);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow-y:auto;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.modal{background:var(--surface);border-radius:18px;border:1px solid var(--border);width:100%;max-width:560px;box-shadow:var(--shadow-lg);animation:slideUp .22s ease;margin:auto}
.modal-wide{max-width:860px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);border-radius:18px 18px 0 0;z-index:2}
.modal-head h3{margin:0;font-size:1.05rem}
.modal-body{padding:22px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding-top:18px;margin-top:6px;border-top:1px solid var(--border)}
#toasts{position:fixed;top:18px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:10px;max-width:min(360px,92vw)}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--ok);padding:13px 16px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:.9rem;font-weight:600;animation:slideUp .22s ease}
.toast.err{border-left-color:var(--err)}
.toast.warn{border-left-color:var(--warn)}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,var(--primary),#081627)}
.login-card{width:100%;max-width:460px;background:var(--surface);border-radius:20px;padding:32px 30px;box-shadow:0 30px 80px rgba(0,0,0,.42);border:1px solid var(--border)}
.login-logo{width:54px;height:54px;border-radius:15px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.1rem;margin:0 auto 18px;border:1px solid rgba(201,162,39,.5)}
.login-card h2{text-align:center;font-size:1.4rem;margin-bottom:6px}
.login-card .sub{text-align:center;color:var(--muted);font-size:.88rem;margin-bottom:22px}
.alert{padding:12px 15px;border-radius:11px;font-size:.86rem;font-weight:600;margin-bottom:16px;border:1px solid}
.alert-err{background:rgba(198,40,40,.1);border-color:rgba(198,40,40,.35);color:var(--err)}
.alert-ok{background:rgba(18,133,90,.1);border-color:rgba(18,133,90,.35);color:var(--ok)}
.alert-warn{background:rgba(178,106,0,.1);border-color:rgba(178,106,0,.35);color:var(--warn)}
.alert-info{background:rgba(41,98,255,.08);border-color:rgba(41,98,255,.3);color:#2962ff}

function deepMerge(base, extra){
  if(Array.isArray(base)) return Array.isArray(extra) ? extra : base;
  if(base && typeof base === 'object'){
    const out = Object.assign({}, base);
    if(extra && typeof extra === 'object'){
      Object.keys(extra).forEach(k=>{ out[k] = (k in base) ? deepMerge(base[k], extra[k]) : extra[k]; });
    }
    return out;
  }
  return extra === undefined ? base : extra;
}

function hydrate(parsed){
  const merged = deepMerge(JSON.parse(JSON.stringify(DEFAULT_DATA)), parsed || {});
  if(!parsed || parsed._v !== 3){
    const keepName  = merged.admin && merged.admin.displayName;
    const keepPhoto = merged.admin && merged.admin.photo;
    merged._v = 3;
    merged.admin = Object.assign({}, DEFAULT_DATA.admin);
    if(keepName)  merged.admin.displayName = keepName;
    if(keepPhoto) merged.admin.photo = keepPhoto;
    if(!merged.users) merged.users = [];
    if(!merged.followers) merged.followers = [];
    if(!merged.postLikes) merged.postLikes = {};
  }
  if(!merged.reviews) merged.reviews = [];
  if(!merged.tombstones) merged.tombstones = { posts:[], projects:[], reviews:[] };
  if(!merged.tombstones.posts) merged.tombstones.posts = [];
  if(!merged.tombstones.projects) merged.tombstones.projects = [];
  if(!merged.tombstones.reviews) merged.tombstones.reviews = [];
  if(Array.isArray(merged.nav) && !merged.nav.some(n => n && n.target === 'reviews')){
    merged.nav.push({ id:'n_reviews', label:'Reviews', target:'reviews', visible:true });
  }
  return merged;
}

}

  if(!DB.tombstones[kind].includes(id)) DB.tombstones[kind].push(id);
}

/* ------------------------- Firebase read / write ---------------------- */
let fbReady = false;
let fbTimer = null;

async function fbLoad(){
  try{
    const snap = await dbGet(dbRef(rtdb, DB_ROOT));
    if(snap.exists()) return snap.val();
  }catch(e){
    console.warn('Firebase load failed:', e);
    toast('Firebase read failed — running from local cache.', 'warn');
  }
  return null;
}

async function fbWrite(){
  if(!fbReady) return false;
  let lastErr = null;
  for(let attempt = 0; attempt < 2; attempt++){
    try{
      const clean = JSON.parse(JSON.stringify(DB));
      const size = JSON.stringify(clean).length;
      if(size > 5 * 1024 * 1024){
        console.warn(`DB payload ${(size/1024/1024).toFixed(2)}MB — may be slow.`);
      }
      await dbSet(dbRef(rtdb, DB_ROOT), clean);
      return true;
    }catch(e){
      lastErr = e;
      console.warn(`Firebase write attempt ${attempt+1}/2 failed:`, e && e.message);
      if(attempt === 0) await new Promise(r => setTimeout(r, 700));
    }
  }
  toast('Cloud save failed: ' + (lastErr && lastErr.message || 'unknown'), 'err');
  return false;
}

async function save(immediate){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }
  catch(e){ console.error('Local cache save failed:', e); }
  clearTimeout(fbTimer);
  if(immediate) return await fbWrite();

/* ------------------------- Firebase Storage -------------------------- */
let STORAGE_OK = null;

function dataUrlToBlob(dataUrl){
  if(!dataUrl || !/^data:/.test(dataUrl)) throw new Error('Invalid data URL');
  const comma = dataUrl.indexOf(',');
  if(comma < 0) throw new Error('Invalid data URL');
  const meta = dataUrl.slice(0, comma);
  const b64  = dataUrl.slice(comma + 1);
  const mimeMatch = /^data:([^;]+)/.exec(meta);
  const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
  const bin  = atob(b64);
  const len  = bin.length;
  const bytes = new Uint8Array(len);
  for(let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

async function uploadDataUrl(dataUrl, folder, ext, contentType, onProgress){
  if(!dataUrl) return '';
  if(!/^data:/i.test(dataUrl)) return dataUrl;
  const blob = dataUrlToBlob(dataUrl);
  const finalType = contentType || blob.type || 'image/jpeg';
  const name = `${folder}/${Date.now()}-${uid()}${ext || '.jpg'}`;
  const r = storageRef(storage, `portfolio/${name}`);
  return await new Promise((resolve, reject)=>{
    const task = uploadBytesResumable(r, blob, { contentType: finalType });
    task.on('state_changed',
      (snap)=>{
        if(onProgress && snap.totalBytes){
          onProgress(Math.round((snap.bytesTransferred / snap.totalBytes) * 100));
        }
      },
      (err)=>{ reject(new Error((err && err.message) || 'Upload failed')); },
      ()=>{ getDownloadURL(task.snapshot.ref).then(resolve).catch(reject); }
    );
  });
}

async function safeUpload(dataUrl, folder, ext, contentType, onProgress){
  if(!dataUrl) return '';
  if(!/^data:/i.test(dataUrl)) return dataUrl;
  if(STORAGE_OK === false){
    if(onProgress) onProgress(100);
    return dataUrl;
  }
  const timeoutMs = STORAGE_OK === null ? 8000 : 12000;
  try{
    const timeout = new Promise((_, reject) =>
      setTimeout(() => reject(new Error('Upload timeout')), timeoutMs)
    );
    const upload = uploadDataUrl(dataUrl, folder, ext, contentType, onProgress);
    const url = await Promise.race([upload, timeout]);
    if(STORAGE_OK === null) STORAGE_OK = true;
    return url;
  }catch(e){
    STORAGE_OK = false;
    console.warn('Storage upload failed — using inline base64:', e && e.message);
    if(onProgress) onProgress(100);
    return dataUrl;
  }
}

async function sha256(str){
  if(window.crypto && window.crypto.subtle && window.isSecureContext !== false){
    try{
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }catch(e){}
  }
  let h1 = 0x811c9dc5, h2 = 0x1000193;
  for(let i=0;i<str.length;i++){
    const c = str.charCodeAt(i);
    h1 = ((h1 ^ c) * 16777619) >>> 0;
    h2 = ((h2 + c) * 2654435761) >>> 0;
  }
  return 'fb' + h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0');
}

function readImageFile(file, maxW, quality){
  maxW = maxW || 1200; quality = quality || 0.78;
  return new Promise((resolve, reject)=>{
    const fileType = (file.type || '').toLowerCase();
    const fileName = (file.name || '').toLowerCase();
    const isImage = /^image\//.test(fileType) || /\.(jpe?g|png|webp|gif|bmp|heic|heif|avif|tiff?)$/i.test(fileName);
    if(!isImage) return reject(new Error('Unsupported format. Use JPG, PNG, WebP, GIF, BMP or HEIC.'));
    if(file.size > 15 * 1024 * 1024) return reject(new Error('File is larger than 15 MB.'));
    const fr = new FileReader();
    fr.onerror = ()=> reject(new Error('Could not read the file.'));
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('The image could not be decoded. Try a JPG or PNG file.'));
      img.onload = ()=>{
        let w = img.naturalWidth, h = img.naturalHeight;
        if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);
        try{ resolve(c.toDataURL('image/jpeg', quality)); }
        catch(e){ reject(new Error('Image conversion failed.')); }
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

const ALLOWED_TAGS = new Set(['P','BR','B','STRONG','I','EM','U','S','H1','H2','H3','H4','UL','OL','LI','A','IMG','BLOCKQUOTE','PRE','CODE','SPAN','DIV','HR','FIGURE','FIGCAPTION','TABLE','THEAD','TBODY','TR','TD','TH']);
const ALLOWED_ATTRS = new Set(['href','src','alt','title','target','rel']);
function sanitizeHtml(html){
  const tpl = document.createElement('template');
  tpl.innerHTML = html || '';
  (function clean(parent){
    Array.from(parent.childNodes).forEach(node=>{
      if(node.nodeType === 8){ node.remove(); return; }
      if(node.nodeType !== 1) return;
      if(!ALLOWED_TAGS.has(node.tagName)){
        const frag = document.createDocumentFragment();
        while(node.firstChild) frag.appendChild(node.firstChild);
        node.replaceWith(frag);
        clean(parent);
        return;
      }
      Array.from(node.attributes).forEach(attr=>{
        const n = attr.name.toLowerCase();
        const val = attr.value || '';
        if(n.startsWith('on') || !ALLOWED_ATTRS.has(n)){ node.removeAttribute(attr.name); return; }
        if((n === 'href' || n === 'src') && /^\s*(javascript|vbscript):/i.test(val)){ node.removeAttribute(attr.name); }
        if(n === 'src' && /^\s*data:/i.test(val) && !/^data:image\//i.test(val)){ node.removeAttribute(attr.name); }
      });
      if(node.tagName === 'A'){ node.setAttribute('rel','noopener noreferrer'); }
      clean(node);
    });
  })(tpl.content);
  return tpl.innerHTML;
}

function shade(hex, percent){
  const h = hex.replace('#',''); if(h.length !== 6) return hex;
  const num = parseInt(h,16);
  let r = (num>>16)+percent, g = ((num>>8)&0xff)+percent, b = (num&0xff)+percent;
  r = Math.max(0,Math.min(255,r)); g = Math.max(0,Math.min(255,g)); b = Math.max(0,Math.min(255,b));
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}

function bindPublic(){
  const nt = $('#navToggle'), nl = $('#navLinks');
  if(nt) nt.addEventListener('click', ()=> nl.classList.toggle('open'));

  const tt = $('#themeToggle');
  if(tt) tt.addEventListener('click', ()=>{
    DB.settings.theme = DB.settings.theme === 'dark' ? 'light' : 'dark';
    save(true);
    document.documentElement.setAttribute('data-theme', DB.settings.theme);
  });

  const uc = $('#userChip'), um = $('#userMenu');
  if(uc && um){
    uc.addEventListener('click', (e)=>{
      if(e.target.closest('a')) return;
      e.stopPropagation();
      um.classList.toggle('open');
    });
  }
  const uso = $('#userSignOut');
  if(uso) uso.addEventListener('click', async (e)=>{
    e.preventDefault();
    await signOutUser();
  });

  $$('[data-scroll]').forEach(a=>{
    a.addEventListener('click', (ev)=>{
      ev.preventDefault();
      const id = a.getAttribute('data-scroll');
      if(location.hash !== '#/' && location.hash !== '') history.replaceState(null,'','#/');
      const el = document.getElementById(id);
      if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); }
      else { location.hash = '#/'; }
      if(nl) nl.classList.remove('open');
    });
  });

  setTimeout(()=>{ $$('.bar > i[data-level]').forEach(b=> b.style.width = b.getAttribute('data-level') + '%'); }, 120);

  const cvBtn = $('#downloadCv');
  if(cvBtn) cvBtn.addEventListener('click', ()=>{
    if(!DB.profile.cv){ toast('CV not uploaded yet. Upload it from the admin dashboard.', 'warn'); return; }
    const a = document.createElement('a');
    a.href = DB.profile.cv;
    a.download = (DB.profile.name || 'CV').replace(/\s+/g,'_') + '_CV.pdf';
    a.target = '_blank';
    document.body.appendChild(a); a.click(); a.remove();
  });

  /* Follow — requires login */
  const fb = $('#followBtn');
  if(fb) fb.addEventListener('click', ()=>{
    if(!USER){
      toast('Please sign in to follow.', 'warn');
      setTimeout(()=>{ location.hash = '#/login'; }, 700);
      return;
    }
    const nowFollowing = toggleFollow();
    save(true);
    toast(nowFollowing ? '✓ Now following!' : 'Unfollowed.');
    updateFollowBtn();
  });

  const pf = $('#projFilters');
  if(pf){
    pf.addEventListener('click', (e)=>{
      const btn = e.target.closest('[data-cat]'); if(!btn) return;
      $$('#projFilters .chip').forEach(c=>c.classList.remove('active'));
      btn.classList.add('active');
      const cat = btn.getAttribute('data-cat');
      $$('#projGrid .proj-card').forEach(card=>{
        const p = DB.projects.find(x=>x.id === card.getAttribute('data-project'));
        card.style.display = (cat === 'All' || (p && p.category === cat)) ? '' : 'none';
      });
    });
  }

  $$('[data-project]').forEach(card=> card.addEventListener('click', ()=> openProjectModal(card.getAttribute('data-project'))));
  $$('[data-post]').forEach(card=> card.addEventListener('click', ()=>{ location.hash = '#/post/' + card.getAttribute('data-post'); }));

  $$('[data-like]').forEach(b=>{
    b.addEventListener('click', (e)=>{
      e.stopPropagation(); e.preventDefault();
      const id = b.getAttribute('data-like');
      const nowLiked = toggleLike(id);
      $$('[data-like="'+id+'"]').forEach(btn=>{
        btn.classList.toggle('liked', nowLiked);
        btn.innerHTML = (nowLiked?'❤':'♡') + ' ' + likeCount(id);
      });
    });
  });

  $$('[data-share]').forEach(b=>{
    b.addEventListener('click', (e)=>{
      e.stopPropagation(); e.preventDefault();
      sharePost(b.getAttribute('data-share'));
    });
  });

  /* Review form */
  const rf = $('#reviewForm');
  if(rf){
    const startedAt = Date.now();
    rf.addEventListener('submit', async (e)=>{
      e.preventDefault();
      if(!USER){ toast('Please sign in to review.', 'warn'); return; }
      const fd = new FormData(rf);
      if(fd.get('company_website')){ toast('Review blocked.'); return; }
      if(Date.now() - startedAt < 1200){ toast('Please take a moment before submitting.', 'warn'); return; }
      const rating = Math.min(5, Math.max(1, Number(fd.get('rating'))||5));
      const text = String(fd.get('text')||'').trim().slice(0,1000);
      const name = String(fd.get('name')||'').trim().slice(0,80);
      if(!text || !name){ toast('Please fill in all fields.', 'err'); return; }
      DB.reviews = DB.reviews || [];
      const existing = DB.reviews.find(r => r.userId === USER.id);
      if(existing){
        existing.name = name;
        existing.rating = rating;
        existing.text = text;
        existing.date = nowISO();
        logActivity('Review updated by ' + name);
      } else {
        DB.reviews.unshift({
          id: uid(),
          name,
          email: USER.email || '',
          userId: USER.id,
          rating,
          text,
          date: nowISO()
        });
        logActivity('New review from ' + name);
      }
      const btn = rf.querySelector('button[type=submit]');
      if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
      const ok = await save(true);
      toast(ok ? '✓ Review saved. Thank you!' : 'Review saved locally. Cloud sync pending.', ok ? undefined : 'warn');
      renderPublic();
    });
  }

  const cf = $('#contactForm');
  if(cf){
    const startedAt = Date.now();
    cf.addEventListener('submit', (e)=>{
      e.preventDefault();
      const fd = new FormData(cf);
      if(fd.get('company_website')){ toast('Message blocked.'); return; }
      if(Date.now() - startedAt < 1200){ toast('Please take a moment before submitting.', 'warn'); return; }
      const msg = {
        id: uid(),
        name: String(fd.get('name')||'').slice(0,80),
        email: String(fd.get('email')||'').slice(0,120),
        subject: String(fd.get('subject')||'').slice(0,140) || 'Portfolio enquiry',
        message: String(fd.get('message')||'').slice(0,2000),
        read: false,
        createdAt: nowISO()
      };
      if(!msg.name || !msg.email || !msg.message){ toast('Please fill in all required fields.', 'err'); return; }
      DB.messages.unshift(msg);
      save(true);
      logActivity('New contact message from ' + msg.name);
      cf.reset();
      toast('Message sent successfully. Thank you!');
    });
  }
}

/* ------------------------- Google Auth helpers ------------------------- */
async function onGoogleSignIn(){
  try{
    await signInWithPopup(auth, googleProvider);
  }catch(e){
    console.error('Google sign-in failed:', e);
    if(e && e.code === 'auth/popup-blocked'){
      toast('Popup blocked. Allow popups for this site and try again.', 'err');
    } else if(e && e.code === 'auth/popup-closed-by-user'){
      /* silent */
    } else if(e && e.code === 'auth/unauthorized-domain'){
      toast('This domain is not authorized in Firebase Auth settings.', 'err');
    } else {
      toast('Google sign-in failed: ' + ((e && e.message) || e), 'err');
    }
  }
}
async function signOutUser(){
  try{ await fbSignOut(auth); }catch(e){}
  setUser(null);
  save(true);
  toast('Signed out.');
  if(!location.hash.startsWith('#/admin')) route();
  else renderLogin();
}

        </p>

  const gBtn = $('#googleSignInBtn');
  if(gBtn) gBtn.addEventListener('click', onGoogleSignIn);

  const usl = $('#userSignOutLogin');
  if(usl) usl.addEventListener('click', ()=> signOutUser());

  const aso = $('#adminSignOutLogin');
  if(aso) aso.addEventListener('click', ()=>{
    clearSession(); logActivity('Admin signed out'); save(true);
    toast('Admin signed out.'); renderLogin();
  });

  const form = $('#loginForm');
  if(!form){ applyLighting(); return; }
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const rate = rateGet();
    if(rate.lockUntil && Date.now() < rate.lockUntil){ toast('Locked out. Please wait.', 'err'); return; }
    const email = $('#loginEmail').value.trim().toLowerCase();
    const pw = $('#loginPassword').value;
    const remember = $('#loginRemember').checked;
    const alertBox = $('#loginAlert');
    alertBox.innerHTML = '';
    const hash = await hashPassword(pw, DB.admin.salt);
    if(email === String(DB.admin.email).toLowerCase() && hash === DB.admin.passwordHash){
      rateSet({fails:0, lockUntil:0});
      writeSession(remember, false);
      DB.admin.lastLogin = nowISO();
      logActivity('Admin signed in');
      save(true);
      toast('Welcome back!');
      location.hash = '#/admin/overview';
    }else{
      const fails = (rate.fails || 0) + 1;
      const lockUntil = fails >= 5 ? Date.now() + 60000 : 0;
      rateSet({ fails: lockUntil ? 0 : fails, lockUntil });
      alertBox.innerHTML = `<div class="alert alert-err">Invalid email or password.${lockUntil?' Account locked for 60 seconds.':''}</div>`;
      $('#loginPassword').value = '';
    }
  });

  applyLighting();
}

          New password must be at least 8 characters and include letters and numbers.
        </div>
        <div id="pcAlert"></div>
        <form id="forcePcForm">
          <label class="field"><span>Current (Temporary) Password</span><input type="password" name="current" required autocomplete="current-password"></label>
          <label class="field"><span>New Password</span><input type="password" name="next" required minlength="8" autocomplete="new-password"></label>
          <label class="field"><span>Confirm New Password</span><input type="password" name="confirm" required minlength="8" autocomplete="new-password"></label>
          <button class="btn btn-primary" type="submit" style="width:100%">Update Password &amp; Open Dashboard</button>
        </form>

        </p>
      </div>
    </div>`;

  $('#forceLogout').addEventListener('click', (e)=>{ e.preventDefault(); clearSession(); location.hash = '#/admin/login'; });

  $('#forcePcForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const cur = fd.get('current'), next = fd.get('next'), conf = fd.get('confirm');
    const alertBox = $('#pcAlert');
    alertBox.innerHTML = '';
    const curHash = await hashPassword(cur, DB.admin.salt);
    if(curHash !== DB.admin.passwordHash){
      alertBox.innerHTML = `<div class="alert alert-err">Current password is incorrect.</div>`; return;
    }
    if(next !== conf){ alertBox.innerHTML = `<div class="alert alert-err">New passwords do not match.</div>`; return; }
    if(!isStrong(next)){ alertBox.innerHTML = `<div class="alert alert-err">Password must be 8+ characters with letters and numbers.</div>`; return; }
    DB.admin.salt = uid() + uid();
    DB.admin.passwordHash = await hashPassword(next, DB.admin.salt);
    DB.admin.mustChangePassword = false;
    logActivity('Admin password changed (first login)');
    save(true);
    toast('Password updated. Welcome to your dashboard.');
    try{ history.replaceState(null, '', '#/admin/overview'); }catch(err){}
    renderAdmin('overview');
  });
}

function isStrong(pw){
  return typeof pw === 'string' && pw.length >= 8 && /[A-Za-z]/.test(pw) && /[0-9]/.test(pw);
}

function renderField(f, value){
  const v = value == null ? (f.default == null ? '' : f.default) : value;
  const req = f.required ? ' <span class="req">*</span>' : '';
  const nameAttr = `name="${esc(f.name)}" id="fld-${esc(f.name)}"`;
  const ph = f.placeholder ? ` placeholder="${esc(f.placeholder)}"` : '';

  if(f.type === 'textarea'){
    return `<label class="field"><span>${esc(f.label)}${req}</span><textarea ${nameAttr} rows="${f.rows||4}"${ph} ${f.required?'required':''}>${esc(v)}</textarea></label>`;
  }
  if(f.type === 'select'){
    return `<label class="field"><span>${esc(f.label)}${req}</span><select ${nameAttr}>
      ${f.options.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(v)?'selected':''}>${esc(o.label)}</option>`).join('')}
    </select></label>`;
  }
  if(f.type === 'image'){
    return `<div class="field"><span>${esc(f.label)}</span>
      <div class="image-field" data-image-field>
        <img class="image-preview ${v?'':'empty'}" src="${v?esc(v):''}" alt="">
        <div style="flex:1;min-width:150px">
          <input type="file" accept="image/*" class="image-input" style="font-size:.82rem">
          <input type="hidden" ${nameAttr} value="${esc(v)}">
          <button type="button" class="btn btn-ghost btn-sm" data-clear-image style="margin-top:8px">Remove</button>
          <div class="small muted image-status" style="margin-top:6px"></div>
        </div>
      </div>
    </div>`;
  }
  if(f.type === 'checkbox'){
    return `<label class="check"><input type="checkbox" ${nameAttr} ${v?'checked':''}> ${esc(f.label)}</label>`;
  }
  if(f.type === 'richtext'){
    return `<div class="field"><span>${esc(f.label)}</span>
      <div class="rte" data-richtext>
        <div class="rte-toolbar">
          <button type="button" data-cmd="bold"><b>B</b></button>
          <button type="button" data-cmd="italic"><i>I</i></button>
          <button type="button" data-cmd="underline"><u>U</u></button>
          <button type="button" data-cmd="formatBlock" data-val="h2">H2</button>
          <button type="button" data-cmd="formatBlock" data-val="h3">H3</button>
          <button type="button" data-cmd="formatBlock" data-val="p">P</button>
          <button type="button" data-cmd="insertUnorderedList">• List</button>
          <button type="button" data-cmd="insertOrderedList">1. List</button>
          <button type="button" data-cmd="createLink">🔗 Link</button>
          <button type="button" data-cmd="insertImage">🖼 Image</button>
          <button type="button" data-cmd="removeFormat">✕ Clear</button>
        </div>
        <div class="rte-content" contenteditable="true">${sanitizeHtml(v)}</div>
        <input type="hidden" ${nameAttr} value="${esc(v)}">
      </div>
    </div>`;
  }
  const type = f.type || 'text';
  return `<label class="field"><span>${esc(f.label)}${req}</span>
    <input type="${type}" ${nameAttr} value="${esc(v)}"${ph} ${f.required?'required':''} ${f.min!=null?`min="${f.min}"`:''} ${f.max!=null?`max="${f.max}"`:''} ${f.step?`step="${f.step}"`:''}>
  </label>`;
}

function openFormModal(opts){
  const { title, fields, values = {}, onSubmit, wide = false, submitLabel = 'Save' } = opts;
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.innerHTML = `
    <div class="modal ${wide?'modal-wide':''}" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3>${esc(title)}</h3>
        <button type="button" class="icon-btn" data-close>&times;</button>
      </div>
      <form class="modal-body" novalidate>
        ${fields.map(f=>renderField(f, values[f.name])).join('')}
        <div class="modal-foot">
          <button type="button" class="btn btn-ghost" data-close>Cancel</button>
          <button type="submit" class="btn btn-primary">${esc(submitLabel)}</button>
        </div>
      </form>
    </div>`;
  document.body.appendChild(wrap);

  const form = $('form', wrap);
  wrap.addEventListener('click', (e)=>{ if(e.target === wrap || e.target.closest('[data-close]')) wrap.remove(); });
  document.addEventListener('keydown', function onEsc(e){
    if(e.key === 'Escape'){ wrap.remove(); document.removeEventListener('keydown', onEsc); }
  });

  $$('[data-image-field]', wrap).forEach(box=>{
    const fileInput = $('.image-input', box);
    const hidden = $('input[type=hidden]', box);
    const preview = $('.image-preview', box);
    const status  = $('.image-status', box);
    const fieldName = hidden.getAttribute('name') || 'field';
    fileInput.addEventListener('change', async ()=>{
      const file = fileInput.files && fileInput.files[0]; if(!file) return;
      fileInput.disabled = true;
      try{
        const o = imageOpts(fieldName);
        if(status) status.textContent = 'Compressing…';
        const dataUrl = await readImageFile(file, o.maxW, o.q);
        if(status) status.textContent = 'Uploading… 0%';
        const url = await safeUpload(dataUrl, 'images', '.jpg', 'image/jpeg', (pct)=>{
          if(status) status.textContent = `Uploading… ${pct}%`;
        });
        hidden.value = url;
        preview.src = url;
        preview.classList.remove('empty');
        if(status) status.textContent = '✓ Ready';
        toast('Image ready.');
      }catch(err){
        console.error('Image upload failed:', err);
        if(status) status.textContent = '✗ ' + (err.message || 'Upload failed');
        toast('Image upload failed: ' + (err.message || err), 'err');
      } finally {
        fileInput.disabled = false;
        fileInput.value = '';
      }
    });
    $('[data-clear-image]', box).addEventListener('click', ()=>{
      hidden.value = ''; preview.removeAttribute('src'); preview.classList.add('empty');
      if(status) status.textContent = '';
    });
  });

  $$('[data-richtext]', wrap).forEach(rte=>{
    const content = $('.rte-content', rte);
    const hidden = $('input[type=hidden]', rte);
    const toolbar = $('.rte-toolbar', rte);
    toolbar.addEventListener('click', async (e)=>{
      const btn = e.target.closest('button[data-cmd]'); if(!btn) return;
      e.preventDefault();
      const cmd = btn.getAttribute('data-cmd');
      content.focus();
      if(cmd === 'createLink'){
        const url = prompt('Enter URL (https://...)');
        if(url && /^https?:\/\//i.test(url)) document.execCommand('createLink', false, url);
        return;
      }
      if(cmd === 'insertImage'){
        const inp = document.createElement('input');
        inp.type = 'file'; inp.accept = 'image/*';
        inp.onchange = async ()=>{
          const file = inp.files && inp.files[0]; if(!file) return;
          try{
            const o = imageOpts('inline');
            const dataUrl = await readImageFile(file, o.maxW, o.q);
            toast('Uploading inline image…');
            const url = await safeUpload(dataUrl, 'inline', '.jpg', 'image/jpeg');
            document.execCommand('insertImage', false, url);
            hidden.value = content.innerHTML;
          }catch(err){ toast(err.message, 'err'); }
        };
        inp.click();
        return;
      }
      if(cmd === 'formatBlock'){ document.execCommand('formatBlock', false, btn.getAttribute('data-val')); }
      else{ document.execCommand(cmd, false, null); }
    });
    content.addEventListener('input', ()=>{ hidden.value = content.innerHTML; });
  });

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    $$('[data-richtext]', wrap).forEach(rte=>{
      $('input[type=hidden]', rte).value = $('.rte-content', rte).innerHTML;
    });
    const fd = new FormData(form);
    const out = {};
    fields.forEach(f=>{
      if(f.type === 'checkbox') out[f.name] = fd.get(f.name) === 'on';
      else if(f.type === 'number') out[f.name] = Number(fd.get(f.name) || 0);
      else out[f.name] = (fd.get(f.name) || '').toString();
    });
    for(const f of fields){
      if(f.required && !String(out[f.name]||'').trim()){ toast('Please fill in: ' + f.label, 'err'); return; }
    }
    const submitBtn = $('button[type=submit]', wrap);
    if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = 'Saving…'; }
    try{
      for(const f of fields){
        if(f.type === 'image' && out[f.name] && /^data:/i.test(out[f.name])){
          out[f.name] = await processImageValue(out[f.name], f.name, '.jpg', (pct)=>{
            if(submitBtn) submitBtn.textContent = `Uploading… ${pct}%`;
          });
        }
      }
      await onSubmit(out);
      wrap.remove();
    }catch(err){
      console.error(err);
      toast('Could not save: ' + (err && err.message || err), 'err');
      if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = submitLabel; }
    }
  });
}

      <div class="panel-head"><h2>Hero Statistics</h2><button class="btn btn-ghost btn-sm" id="addStat">＋ Add Stat</button></div>
      <div id="statList">
        ${DB.stats.map(s=>`
          <div class="list-row">
            <div class="grow"><b>${esc(s.value)} — ${esc(s.label)}</b></div>
            <div class="row-actions">
              <button class="btn btn-ghost btn-sm" data-edit-stat="${esc(s.id)}">Edit</button>

            </div>
          </div>`).join('') || '<div class="empty">No statistics yet.</div>'}
      </div>
    </div>`;

  const form = $('#profileForm');
  const tempPhoto = { photo: p.photo, cover: p.cover };

  $$('[data-upload]', form).forEach(box=>{
    const key = box.getAttribute('data-upload');
    const fileInput = $('.image-input', box);
    const preview = $('.image-preview', box);
    const status  = $('.image-status', box);
    fileInput.addEventListener('change', async ()=>{
      const file = fileInput.files[0]; if(!file) return;
      fileInput.disabled = true;
      try{
        const o = imageOpts(key === 'cover' ? 'cover' : 'profile');
        if(status) status.textContent = 'Compressing…';
        const dataUrl = await readImageFile(file, o.maxW, o.q);
        if(status) status.textContent = 'Uploading… 0%';
        const url = await safeUpload(dataUrl, key === 'cover' ? 'cover' : 'profile', '.jpg', 'image/jpeg', (pct)=>{
          if(status) status.textContent = `Uploading… ${pct}%`;
        });
        tempPhoto[key] = url;
        preview.src = url;
        preview.classList.remove('empty');
        if(status) status.textContent = '✓ Ready';
        toast((key === 'cover' ? 'Cover' : 'Profile photo') + ' ready.');
      }catch(err){
        console.error('Upload failed:', err);
        if(status) status.textContent = '✗ ' + (err.message || 'Upload failed');
        toast('Upload failed: ' + (err.message || err), 'err');
      } finally {
        fileInput.disabled = false;
        fileInput.value = '';
      }
    });
    $('[data-clear]', box).addEventListener('click', ()=>{
      tempPhoto[key] = ''; preview.removeAttribute('src'); preview.classList.add('empty');
      if(status) status.textContent = '';
    });
  });

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(form);
    const submitBtn = $('button[type=submit]', form);
    if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = 'Saving…'; }

    ['name','title','email','phone','whatsapp','location','experience','education','shortBio','bio','certifications'].forEach(k=>{
      DB.profile[k] = String(fd.get(k) || '');
    });
    if(DB.profile.name) DB.admin.displayName = DB.profile.name;

    try{
      if(tempPhoto.photo && /^data:/.test(tempPhoto.photo)){
        tempPhoto.photo = await safeUpload(tempPhoto.photo, 'profile', '.jpg', 'image/jpeg', (pct)=>{
          if(submitBtn) submitBtn.textContent = `Uploading photo… ${pct}%`;
        });
      }
      if(tempPhoto.cover && /^data:/.test(tempPhoto.cover)){
        tempPhoto.cover = await safeUpload(tempPhoto.cover, 'cover', '.jpg', 'image/jpeg', (pct)=>{
          if(submitBtn) submitBtn.textContent = `Uploading cover… ${pct}%`;
        });
      }
    }catch(err){
      toast('Image upload failed: ' + err.message, 'err');
      if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = 'Save Profile'; }
      return;
    }
    DB.profile.photo = tempPhoto.photo;
    DB.profile.cover = tempPhoto.cover;
    logActivity('Profile updated');
    const ok = await save(true);
    toast(ok ? 'Profile saved and synced.' : 'Profile saved locally. Cloud sync pending.', ok ? undefined : 'warn');
    renderAdmin('profile');
  });

  $('#addStat').addEventListener('click', ()=>{
    openFormModal({
      title:'Add Statistic',
      fields:[{name:'value',label:'Value (e.g. 7+)',required:true},{name:'label',label:'Label',required:true}],
      onSubmit: async (v)=>{
        DB.stats.push({ id: uid(), value: v.value, label: v.label });
        logActivity('Statistic added');
        const ok = await save(true);
        toast(ok ? 'Statistic added.' : 'Added locally. Cloud sync pending.', ok ? undefined : 'warn');
        renderAdmin('profile');
      }
    });
  });

  $$('[data-edit-stat]').forEach(b=> b.addEventListener('click', ()=>{
    const s = DB.stats.find(x=>x.id===b.getAttribute('data-edit-stat')); if(!s) return;
    openFormModal({
      title:'Edit Statistic', values: s,
      fields:[{name:'value',label:'Value',required:true},{name:'label',label:'Label',required:true}],
      onSubmit: async (v)=>{ s.value=v.value; s.label=v.label; const ok = await save(true); toast(ok ? 'Updated.' : 'Updated locally. Cloud sync pending.', ok ? undefined : 'warn'); renderAdmin('profile'); }
    });
  }));
  $$('[data-del-stat]').forEach(b=> b.addEventListener('click', async ()=>{
    if(!confirm('Delete this statistic?')) return;
    DB.stats = DB.stats.filter(x=>x.id !== b.getAttribute('data-del-stat'));
    const ok = await save(true);
    toast(ok ? 'Statistic deleted.' : 'Deleted locally. Cloud sync pending.', ok ? undefined : 'warn');
    renderAdmin('profile');
  }));
}

function tabMedia(c){
  const usedBytes = DB.media.reduce((s,m)=> s + (m.size||0), 0);
  c.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h2>Media Library</h2>
        <span class="small muted">${DB.media.length} files · ${(usedBytes/1024/1024).toFixed(2)} MB</span>
      </div>
      <label class="dropzone" id="dropzone" for="mediaInput">
        <div style="font-size:1.8rem;margin-bottom:8px">⬆</div>
        <b>Click to browse or drag &amp; drop images here</b>
        <div class="small">JPG, PNG, WebP, GIF, BMP, HEIC · max 15 MB each</div>
        <input type="file" id="mediaInput" accept="image/*" multiple style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
      </label>
      <div id="mediaProgress" class="small" style="margin-top:10px;display:none">
        <div class="muted" id="mediaProgressText"></div>
        <div class="bar" style="margin-top:6px"><i id="mediaProgressBar" style="width:0%"></i></div>
      </div>
      <div style="margin-top:16px">
        <input type="text" id="mediaSearch" placeholder="Search media by name or caption…">
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Uploaded Images</h2></div>
      <div class="media-grid" id="mediaGrid"></div>
    </div>`;

  function drawMedia(filter){
    const grid = $('#mediaGrid');
    const q = (filter||'').toLowerCase();
    const list = DB.media.filter(m=> !q || (m.name+' '+(m.caption||'')+' '+(m.alt||'')).toLowerCase().includes(q));
    grid.innerHTML = list.length ? list.map(m=>`
      <div class="media-item">
        <img src="${m.dataUrl}" alt="${esc(m.alt||m.name)}">
        <button class="mi-del" data-del-media="${esc(m.id)}" title="Delete">×</button>
        <div class="mi-body">
          <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.name)}</div>
          <div>${(m.size/1024).toFixed(0)} KB</div>
          <button class="btn btn-ghost btn-sm" style="margin-top:6px;padding:3px 8px;font-size:.72rem" data-copy-media="${esc(m.id)}">Copy URL</button>
        </div>
      </div>`).join('') : '<div class="empty" style="grid-column:1/-1">No media uploaded yet.</div>';

    $$('[data-del-media]', grid).forEach(b=> b.addEventListener('click', async ()=>{
      const id = b.getAttribute('data-del-media');
      const m = DB.media.find(x=>x.id===id); if(!m) return;
      if(!confirm('Delete this image?')) return;
      DB.media = DB.media.filter(x=>x.id !== id);
      deleteStorageUrl(m.dataUrl);
      const ok = await save(true);
      toast(ok ? 'Image deleted.' : 'Deleted locally. Cloud sync pending.', ok ? undefined : 'warn');
      drawMedia($('#mediaSearch').value);
    }));
    $$('[data-copy-media]', grid).forEach(b=> b.addEventListener('click', ()=>{
      const m = DB.media.find(x=>x.id===b.getAttribute('data-copy-media')); if(!m) return;
      navigator.clipboard && navigator.clipboard.writeText(m.dataUrl)
        .then(()=> toast('Image URL copied to clipboard.'))
        .catch(()=> toast('Copy failed — browser blocked clipboard.', 'err'));
    }));
  }

  drawMedia('');

  const dz = $('#dropzone'), input = $('#mediaInput');
  const progress = $('#mediaProgress');
  const progressText = $('#mediaProgressText');
  const progressBar  = $('#mediaProgressBar');

  ['dragenter','dragover'].forEach(ev=> dz.addEventListener(ev, (e)=>{ e.preventDefault(); dz.classList.add('drag'); }));
  ['dragleave','drop'].forEach(ev=> dz.addEventListener(ev, (e)=>{ e.preventDefault(); dz.classList.remove('drag'); }));
  dz.addEventListener('drop', (e)=>{
    e.preventDefault();
    const files = e.dataTransfer && e.dataTransfer.files;
    if(files && files.length) handleFiles(files);
  });
  input.addEventListener('change', ()=> {
    if(input.files && input.files.length) handleFiles(input.files);
  });

  async function handleFiles(files){
    if(!files || !files.length) return;
    const fileArr = Array.from(files);
    progress.style.display = 'block';
    let ok = 0, fail = 0;
    for(let i = 0; i < fileArr.length; i++){
      const file = fileArr[i];
      progressText.textContent = `Compressing ${i+1}/${fileArr.length}: ${file.name}`;
      progressBar.style.width = '0%';
      try{
        const o = imageOpts('media');
        const dataUrl = await readImageFile(file, o.maxW, o.q);
        progressText.textContent = `Uploading ${i+1}/${fileArr.length}: ${file.name}`;
        const url = await safeUpload(dataUrl, 'media', '.jpg', 'image/jpeg', (pct)=>{
          progressBar.style.width = pct + '%';
          progressText.textContent = `Uploading ${i+1}/${fileArr.length}: ${file.name} (${pct}%)`;
        });
        const item = {
          id: uid(),
          name: file.name,
          dataUrl: url,
          size: Math.round(dataUrl.length * 0.75),
          alt:'',
          caption:'',
          createdAt: nowISO()
        };
        DB.media.unshift(item);
        ok++;
      }catch(err){
        console.warn('Upload failed:', file.name, err);
        toast((err.message || err) + ' (' + file.name + ')', 'err');
        fail++;
      }
    }
    progress.style.display = 'none';
    progressBar.style.width = '0%';
    progressText.textContent = '';
    if(ok){
      logActivity(ok + ' image(s) uploaded');
      const synced = await save(true);
      toast(ok + ' image(s) uploaded' + (fail ? ' ' + fail + ' failed' : '') + (synced ? ' and synced.' : '. Cloud sync pending.'), synced ? undefined : 'warn');
    } else if(fail){
      toast('No images uploaded. ' + fail + ' file(s) failed.', 'err');
    }
    input.value = '';
    renderAdmin('media');
  }

  $('#mediaSearch').addEventListener('input', (e)=> drawMedia(e.target.value));
}

      </div>

    const file = e.target.files[0]; if(!file) return;
    if(file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name)){ toast('Please upload a PDF file.', 'err'); return; }

          if(status) status.textContent = `Uploading… ${pct}%`;
        });
        const old = DB.profile.cv;
        DB.profile.cv = url;

        toast(ok ? 'CV uploaded and synced.' : 'CV uploaded locally. Cloud sync pending.', ok ? undefined : 'warn');
        renderAdmin('resume');
      }catch(err){
        console.error(err);
        if(status) status.textContent = '✗ ' + (err.message || 'Upload failed');
        toast('CV upload failed: ' + err.message, 'err');
      }
    };
    fr.onerror = ()=> toast('Could not read the file.', 'err');
    fr.readAsDataURL(file);
  });

    { name:'visible', label:'Visible on website', type:'checkbox', default:true }
  ];

      DB.nav.push({ id: uid(), label: v.label, target: v.target, visible: !!v.visible });
      const ok = await save(true);
      toast(ok ? 'Link added.' : 'Added locally. Cloud sync pending.', ok ? undefined : 'warn');
      renderAdmin('nav');
    }});
  });
  $$('[data-edit]').forEach(b=> b.addEventListener('click', ()=>{
    const n = DB.nav.find(x=>x.id===b.getAttribute('data-edit')); if(!n) return;
    openFormModal({ title:'Edit Link', fields, values:n, onSubmit: async (v)=>{
      n.label=v.label; n.target=v.target; n.visible=!!v.visible;
      const ok = await save(true);
      toast(ok ? 'Updated.' : 'Updated locally. Cloud sync pending.', ok ? undefined : 'warn');
      renderAdmin('nav');
    }});
  }));
  $$('[data-toggle]').forEach(b=> b.addEventListener('click', async ()=>{
    const n = DB.nav.find(x=>x.id===b.getAttribute('data-toggle')); if(!n) return;
    n.visible = !n.visible; await save(true); renderAdmin('nav');
  }));
  $$('[data-del]').forEach(b=> b.addEventListener('click', async ()=>{
    if(!confirm('Delete this link?')) return;
    DB.nav = DB.nav.filter(x=>x.id !== b.getAttribute('data-del'));
    await save(true); renderAdmin('nav');
  }));
  $$('[data-up]').forEach(b=> b.addEventListener('click', async ()=>{
    const i = DB.nav.findIndex(x=>x.id===b.getAttribute('data-up'));
    if(i>0){ const [x]=DB.nav.splice(i,1); DB.nav.splice(i-1,0,x); await save(true); renderAdmin('nav'); }
  }));
  $$('[data-down]').forEach(b=> b.addEventListener('click', async ()=>{
    const i = DB.nav.findIndex(x=>x.id===b.getAttribute('data-down'));
    if(i>-1 && i<DB.nav.length-1){ const [x]=DB.nav.splice(i,1); DB.nav.splice(i+1,0,x); await save(true); renderAdmin('nav'); }
  }));
}

/* ------------------------------- boot -------------------------------- */
(async function boot(){
  /* 1) one-time storage probe */
  (async ()=>{
    try{
      const probeRef = storageRef(storage, `portfolio/.probe-${uid()}.txt`);
      const probeBlob = new Blob(['ok'], { type: 'text/plain' });
      await new Promise((resolve, reject)=>{
        const t = uploadBytesResumable(probeRef, probeBlob, { contentType: 'text/plain' });
        t.on('state_changed', null, reject, resolve);
      });
      await deleteObject(probeRef);
      STORAGE_OK = true;
      console.log('✓ Firebase Storage write test passed.');
    }catch(e){
      STORAGE_OK = false;
      console.warn('✗ Firebase Storage unavailable — using inline base64 fallback.');
    }
  })();

  /* 2) pull the latest snapshot from Firebase, merging local tombstones so
        deleted items stay deleted even if a prior cloud write failed. */
  const localTomb = DB.tombstones
    ? JSON.parse(JSON.stringify(DB.tombstones))
    : { posts:[], projects:[], reviews:[] };

  const remote = await fbLoad();
  const hadAdminCreds = !!(remote && remote._adminCreds === 4);
  if(remote){
    DB = hydrate(remote);
  }

  // Union: local tombstones ∪ remote tombstones
  DB.tombstones = DB.tombstones || { posts:[], projects:[], reviews:[] };
  const remoteTomb = {
    posts:    (DB.tombstones.posts || []).slice(),
    projects: (DB.tombstones.projects || []).slice(),
    reviews:  (DB.tombstones.reviews || []).slice()
  };
  let needsResync = false;
  ['posts','projects','reviews'].forEach(k=>{
    const merged = Array.from(new Set([...(localTomb[k]||[]), ...(remoteTomb[k]||[])]));
    if((localTomb[k]||[]).some(id => !remoteTomb[k].includes(id))) needsResync = true;
    DB.tombstones[k] = merged;
  });

  applyTombstones();

  fbReady = true;

  if(needsResync){
    // Push merged tombstones back to Firebase in the background.
    setTimeout(()=>{ save(true); }, 400);
  }

  /* 3) provision / migrate admin credentials */
  if(!DB.admin.salt || !DB.admin.passwordHash || !hadAdminCreds){
    DB.admin.email = 'shamastech@gmail.com';
    DB.admin.salt = uid() + uid();
    DB.admin.passwordHash = await hashPassword('Shamas1122', DB.admin.salt);
    DB.admin.mustChangePassword = false;
    DB._adminCreds = 4;
    save(true);
  } else if(!remote){
    save(true);
  }

  SESSION = readSession();
  document.documentElement.setAttribute('data-theme', DB.settings.theme || 'light');

  document.addEventListener('click', (e)=>{
    const um = document.getElementById('userMenu');
    if(um && !e.target.closest('#userChip')) um.classList.remove('open');
  });

  setInterval(()=>{
    if(SESSION && SESSION.exp <= Date.now()){
      clearSession();
      if(location.hash.startsWith('#/admin') && location.hash !== '#/admin/login'){
        toast('Session expired. Please sign in again.', 'warn');
        location.hash = '#/admin/login';
      }
    }
  }, 30000);

  document.addEventListener('keydown', (e)=>{
    if((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'a'){
      e.preventDefault();
      location.hash = '#/admin/login';
    }
  });

  window.addEventListener('beforeunload', ()=>{ if(fbReady) fbWrite(); });

  /* 4) sync Google user state */
  let authInitialized = false;
  let lastAuthUid = null;
  onAuthStateChanged(auth, async (fbUser)=>{
    const firstRun = !authInitialized;
    authInitialized = true;
    const newUid = fbUser ? fbUser.uid : null;
    if(!firstRun && newUid === lastAuthUid) return;
    lastAuthUid = newUid;

    if(fbUser){
      const profile = {
        id: fbUser.uid,
        name: fbUser.displayName || (fbUser.email||'user').split('@')[0],
        email: fbUser.email || '',
        picture: fbUser.photoURL || '',
        provider: 'google'
      };
      DB.users = DB.users || [];
      const ex = DB.users.find(x=>x.id === fbUser.uid);
      if(ex){
        ex.name = profile.name;
        ex.email = profile.email;
        ex.picture = profile.picture;
        ex.provider = 'google';
      } else {
        DB.users.push({ ...profile, joinedAt: nowISO() });
      }
      setUser(profile);
      save(true);
      if(!location.hash.startsWith('#/admin')) route();
    } else {
      if(USER && USER.provider === 'google'){
        setUser(null);
        if(!location.hash.startsWith('#/admin')) route();
      }
    }
  });

  if(!location.hash) location.hash = '#/';

  route();
})();

</script>
